name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches VERSION
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"

  go-binaries:
    needs: validate
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "", archive: tar.gz }
          - { goos: linux, goarch: arm64, ext: "", archive: tar.gz }
          - { goos: darwin, goarch: amd64, ext: "", archive: tar.gz }
          - { goos: darwin, goarch: arm64, ext: "", archive: tar.gz }
          - { goos: windows, goarch: amd64, ext: .exe, archive: zip }
          - { goos: windows, goarch: arm64, ext: .exe, archive: zip }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          name="chatrepo-mcp_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${name}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go -C go build -trimpath \
              -ldflags "-s -w -X github.com/nssanta/ChatGPT-Repo-MCP/go/internal/app.Version=${version}" \
              -o "../dist/${name}/chatrepo-mcp${{ matrix.ext }}" ./cmd/chatrepo-mcp
          cp LICENSE README.md README_RU.md .env.example "dist/${name}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "${name}.zip" "${name}")
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
          sha256sum "dist/${name}.${{ matrix.archive }}" > "dist/${name}.${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/*.sha256

  python-package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build python
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: python/dist/*

  github-release:
    needs: [go-binaries, python-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
