name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Python/Go · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install Python test dependencies
        run: python -m pip install -e "./python[dev]"
      - name: Python tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PROJECT_ROOT="$PWD" PYTHONPATH=python/src \
              python -m pytest -q \
                python/tests/test_bounded_output_contract.py \
                python/tests/test_bounded_output.py::test_streaming_redactor_hides_chunk_boundary_secrets_and_private_keys \
                python/tests/test_bounded_output.py::test_streaming_redactor_is_fail_closed_at_every_secret_split \
                python/tests/test_bounded_output.py::test_utf8_head_and_tail_are_valid_at_every_byte_boundary \
                python/tests/test_bounded_output.py::test_store_enforces_reserve_quota_and_ttl_without_deleting_pinned \
                python/tests/test_bounded_output.py::test_cleanup_expires_orphans_but_preserves_active_orphan \
                python/tests/test_bounded_output.py::test_restart_reconciles_unowned_running_manifest_and_allows_eviction \
                python/tests/test_bounded_output.py::test_read_refreshes_lru_and_evicts_unread_artifact_first \
                python/tests/test_bounded_output.py::test_metadata_bytes_obey_store_quota_and_fail_closed \
                python/tests/test_bounded_output.py::test_store_is_shared_and_combined_streams_share_one_logical_limit \
                python/tests/test_bounded_output.py::test_store_evicts_completed_lru_but_never_active_artifact \
                python/tests/test_bounded_output.py::test_artifact_write_fault_is_typed_and_rolls_back_accounting \
                python/tests/test_bounded_output.py::test_short_write_is_typed_and_accounts_only_persisted_bytes \
                python/tests/test_bounded_output.py::test_artifact_close_metadata_failure_cleans_active_and_all_streams \
                python/tests/test_bounded_output.py::test_read_artifact_pages_utf8_crlf_and_huge_line_without_rescanning \
                python/tests/test_bounded_subprocess.py \
                python/tests/test_config_from_env.py \
                python/tests/test_edit_tools.py \
                python/tests/test_edit_tools_internals.py \
                python/tests/test_edit_tools_policy_edges.py \
                python/tests/test_edit_tools_validation.py \
                python/tests/test_fs_index_contracts.py \
                python/tests/test_fs_index_lsp_edges.py \
                python/tests/test_fs_search_bounded.py \
                python/tests/test_fs_tools_extended.py \
                python/tests/test_git_tools_extended.py \
                python/tests/test_git_workflow_edges.py \
                python/tests/test_github_tools_comments_checks.py \
                python/tests/test_github_tools_extended.py \
                python/tests/test_github_tools_failures.py \
                python/tests/test_github_tools_scenarios.py \
                python/tests/test_index_tools_extended.py \
                python/tests/test_index_tools_fallbacks.py \
                python/tests/test_lsp_tools_extended.py \
                python/tests/test_output_parsers.py \
                python/tests/test_perimeter.py \
                python/tests/test_profile.py \
                python/tests/test_resource_profile.py \
                python/tests/test_security.py \
                python/tests/test_shared_contract.py \
                python/tests/test_tool_schema.py \
                python/tests/test_workspace.py
          else
            PROJECT_ROOT="$PWD" PYTHONPATH=python/src \
              python -m pytest -q python/tests
          fi
      - name: Go tests
        run: go -C go test ./...
      - name: Build Go server
        run: go -C go build ./cmd/chatrepo-mcp

  contract:
    name: Canonical public contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: python -m pip install -e "./python[dev]"
      - name: Verify generated contract and embedded Go copy
        shell: bash
        run: |
          PROJECT_ROOT="$PWD" ACCESS_MODE=full ENABLE_PTY=true \
            PYTHONPATH=python/src python scripts/check_contracts.py
      - name: Contract-focused Python tests
        shell: bash
        run: |
          PROJECT_ROOT="$PWD" PYTHONPATH=python/src \
            python -m pytest -q \
              python/tests/test_shared_contract.py \
              python/tests/test_tool_schema.py \
              python/tests/test_bounded_output_contract.py
      - name: Embedded Go contract tests
        run: go -C go test ./internal/contracts ./internal/app -run Contract

  linux-hardening:
    name: Linux race and bounded-memory gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMEMLIMIT: 512MiB
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: python -m pip install -e "./python[dev]"
      - name: Race detector under an explicit Go memory limit
        run: go -C go test -race ./...
      - name: Python tracemalloc bounded-output threshold (64 MiB payload, peak below 32 MiB)
        shell: bash
        run: |
          PROJECT_ROOT="$PWD" PYTHONPATH=python/src python -m pytest -q \
            python/tests/test_bounded_output.py::test_run_command_streams_full_redacted_output_to_disk_with_bounded_preview \
            python/tests/test_bounded_output.py::test_four_concurrent_commands_remain_within_global_memory_budget
      - name: Go bounded capture threshold (64 MiB payload, heap delta below 32 MiB)
        run: go -C go test ./internal/tools -run '^Test(StreamCaptureBoundsMemoryAndKeepsDurableOutput|ConcurrentStreamCapturesStayWithinSharedMemoryBudget)$' -count=1
      - name: Vet
        run: go -C go vet ./...

  dual-acceptance:
    name: Packaged dual-server acceptance
    needs: [parity, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: python -m pip install -e "./python[dev]"
      - name: Build Go server
        shell: bash
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go -C go build -trimpath -o ../bin/chatrepo-mcp ./cmd/chatrepo-mcp
      - name: Run Python/Go black-box acceptance
        run: python contracts/acceptance/run_dual_server.py
