name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -U pip
      - run: python -m pip install -e './python[dev]'
      - run: make python-lint python-typecheck python-test contracts-check
      - if: matrix.python == '3.14'
        run: make python-coverage

  go:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - name: Test
        run: go -C go test ./...
      - name: Vet
        run: go -C go vet ./...
      - name: Verify formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l go)"
      - name: Race detector
        if: runner.os == 'Linux' && matrix.go == '1.26.x'
        run: go -C go test -race ./...
      - name: Coverage
        if: runner.os == 'Linux' && matrix.go == '1.26.x'
        run: make go-coverage

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: go -C go mod verify
      - run: govulncheck ./...
        working-directory: go

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: [python, go, security]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: go/go.sum
      - run: python -m pip install build
      - run: python -m build python
      - run: make build
      - run: make acceptance
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-artifacts
          path: |
            python/dist/*
            bin/chatrepo-mcp
