[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatrepo-mcp"
version = "0.1.0"
description = "Full coding-agent MCP server for ChatGPT over a repository, workspace, or trusted machine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI ChatGPT" }
]
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
]
keywords = ["mcp", "chatgpt", "git", "repository", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
chatrepo-mcp = "chatrepo_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
